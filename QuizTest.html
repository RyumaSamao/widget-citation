<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Questions pour un Pirate</title>

<style>

/* =========================================================
   VARIABLES DU DESIGN
========================================================= */

:root {

    --bg: #050608;
    --bg-2: #0a0b0f;

    --panel: rgba(255,255,255,0.045);
    --panel-hover: rgba(255,255,255,0.075);

    --border: rgba(255,255,255,0.09);

    --text: #f5f5f7;
    --muted: #9297a3;

    --red: #d92735;
    --red-light: #ff4c58;
    --red-dark: #80111a;

    --green: #32d583;
    --wrong: #ff5263;

}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: var(--text);

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(217,39,53,0.17),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(128,17,26,0.14),
            transparent 32%
        ),

        linear-gradient(
            145deg,
            #030405,
            #090a0e
        );

    overflow-x: hidden;

}

button,
input {

    font: inherit;

}


/* =========================================================
   APP
========================================================= */

.app {

    width: min(1100px, 92%);

    min-height: 100vh;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 45px 0;

}


/* =========================================================
   SCREENS
========================================================= */

.screen {

    width: 100%;

    display: none;

    animation: appear .35s ease;

}

.screen.active {
    display: block;
}


@keyframes appear {

    from {

        opacity: 0;

        transform:
            translateY(12px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   ACCUEIL
========================================================= */

.home {

    text-align: center;

}


/* Logo Mugiwara */

.logo {

    width: 105px;
    height: 105px;

    margin: 0 auto 28px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            #170709,
            #0d0708
        );

    border:
        1px solid
        rgba(217,39,53,.30);

    box-shadow:

        0 25px 70px
        rgba(0,0,0,.45),

        0 0 50px
        rgba(217,39,53,.10);

    overflow: hidden;

}


.logo img {

    width: 72px;
    height: 72px;

    object-fit: contain;

}


/* Si le fichier logo n'existe pas */

.logo-fallback {

    font-size: 48px;

}


/* Titre */

.home h1 {

    font-size:
        clamp(44px, 7vw, 78px);

    line-height: .92;

    font-weight: 950;

    letter-spacing: -4px;

}


.home h1 span {

    color:
        var(--red);

}


/* =========================================================
   NIVEAUX
========================================================= */

.levels {

    max-width: 850px;

    margin:
        50px auto 0;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;

}


.level {

    padding:
        16px 10px;

    border-radius:
        13px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.07);

}


.level-number {

    font-size:
        10px;

    text-transform:
        uppercase;

    letter-spacing:
        1.5px;

    color:
        var(--muted);

    margin-bottom:
        7px;

}


.level-name {

    font-size:
        14px;

    font-weight:
        850;

}


.level:nth-child(1) {
    border-color:
        rgba(255,255,255,.13);
}


.level:nth-child(4) {

    background:
        linear-gradient(
            145deg,
            rgba(217,39,53,.10),
            rgba(255,255,255,.025)
        );

}


/* =========================================================
   QUIZ TOP
========================================================= */

.quiz-top {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    margin-bottom:
        16px;

}


.current-level {

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    padding:
        8px 13px;

    border-radius:
        10px;

    background:
        rgba(217,39,53,.10);

    border:
        1px solid
        rgba(217,39,53,.22);

}


.level-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background:
        var(--red);

    box-shadow:
        0 0 12px
        var(--red);

}


.current-level span {

    font-size:
        12px;

    font-weight:
        850;

}


/* Bouton passer */

.skip-btn {

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(255,255,255,.025);

    color:
        #777d89;

    padding:
        7px 11px;

    border-radius:
        9px;

    font-size:
        11px;

    cursor:
        pointer;

    transition:
        .2s;

}


.skip-btn:hover {

    color:
        white;

    background:
        rgba(255,255,255,.07);

}


/* =========================================================
   PROGRESSION
========================================================= */

.progress-info {

    display:
        flex;

    justify-content:
        space-between;

    color:
        var(--muted);

    font-size:
        12px;

    margin-bottom:
        7px;

}


.progress {

    width: 100%;

    height: 5px;

    background:
        rgba(255,255,255,.06);

    border-radius:
        20px;

    overflow:
        hidden;

    margin-bottom:
        22px;

}


.progress-bar {

    height: 100%;

    background:
        linear-gradient(
            90deg,
            var(--red-dark),
            var(--red-light)
        );

    transition:
        width .35s ease;

}


/* =========================================================
   CARTE QUESTION
========================================================= */

.question-card {

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        var(--border);

    border-radius:
        25px;

    overflow:
        hidden;

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.38);

}


/* =========================================================
   IMAGE / VISUEL
========================================================= */

.question-visual {

    min-height:
        175px;

    position:
        relative;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    overflow:
        hidden;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);

    background:

        radial-gradient(
            circle,
            rgba(217,39,53,.13),
            transparent 55%
        );

}


.question-visual::before {

    content: "";

    position: absolute;

    width: 270px;
    height: 270px;

    border-radius:
        50%;

    border:
        1px solid
        rgba(217,39,53,.10);

    animation:
        spin 25s linear infinite;

}


.question-visual::after {

    content: "";

    position: absolute;

    width: 190px;
    height: 190px;

    border-radius:
        50%;

    border:
        1px dashed
        rgba(255,255,255,.06);

    animation:
        spinReverse 18s linear infinite;

}


@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }

}


@keyframes spinReverse {

    to {
        transform:
            rotate(-360deg);
    }

}


.visual-icon {

    position:
        relative;

    z-index:
        2;

    font-size:
        70px;

}


.visual-image {

    position:
        relative;

    z-index:
        3;

    max-width:
        85%;

    max-height:
        155px;

    object-fit:
        contain;

    border-radius:
        12px;

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.45);

}


/* =========================================================
   CONTENU QUESTION
========================================================= */

.question-content {

    padding:
        32px 38px 35px;

}


.category {

    color:
        var(--red-light);

    font-size:
        11px;

    text-transform:
        uppercase;

    letter-spacing:
        2px;

    font-weight:
        900;

    margin-bottom:
        13px;

}


.question {

    font-size:
        clamp(27px, 4vw, 39px);

    line-height:
        1.15;

    font-weight:
        900;

    letter-spacing:
        -1px;

    margin-bottom:
        28px;

}


/* =========================================================
   REPONSES
========================================================= */

.answers {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        11px;

}


.answer {

    min-height:
        68px;

    padding:
        13px 17px;

    border:
        1px solid
        rgba(255,255,255,.075);

    border-radius:
        14px;

    background:
        rgba(255,255,255,.035);

    color:
        white;

    text-align:
        left;

    cursor:
        pointer;

    display:
        flex;

    align-items:
        center;

    gap:
        13px;

    font-size:
        15px;

    font-weight:
        700;

    transition:
        .18s;

}


.answer:hover:not(:disabled) {

    transform:
        translateY(-2px);

    background:
        var(--panel-hover);

    border-color:
        rgba(255,255,255,.16);

}


.answer-letter {

    width:
        34px;

    height:
        34px;

    flex-shrink:
        0;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        9px;

    background:
        rgba(255,255,255,.065);

    color:
        #9da3b0;

    font-size:
        13px;

    font-weight:
        900;

}


.answer.correct {

    background:
        rgba(50,213,131,.11);

    border-color:
        var(--green);

}


.answer.correct .answer-letter {

    background:
        var(--green);

    color:
        #06130d;

}


.answer.wrong {

    background:
        rgba(255,82,99,.11);

    border-color:
        var(--wrong);

}


.answer.wrong .answer-letter {

    background:
        var(--wrong);

    color:
        white;

}


.answer:disabled {

    cursor:
        default;

}


/* =========================================================
   REPONSE MULTIPLE
========================================================= */

.answer.selected {

    border-color:
        var(--red);

    background:
        rgba(217,39,53,.10);

}


/* =========================================================
   REPONSE LIBRE
========================================================= */

.free-answer {

    display:
        flex;

    gap:
        10px;

}


.free-answer input {

    flex:
        1;

    min-height:
        58px;

    padding:
        0 18px;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius:
        13px;

    outline:
        none;

    background:
        rgba(255,255,255,.045);

    color:
        white;

}


.free-answer input:focus {

    border-color:
        rgba(217,39,53,.55);

}


.validate-btn {

    border:
        0;

    padding:
        0 22px;

    border-radius:
        13px;

    background:
        var(--red);

    color:
        white;

    font-weight:
        850;

    cursor:
        pointer;

}


/* =========================================================
   ORDRE
========================================================= */

.order-list {

    display:
        flex;

    flex-direction:
        column;

    gap:
        9px;

}


.order-item {

    min-height:
        55px;

    padding:
        12px 16px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:
        12px;

    background:
        rgba(255,255,255,.035);

    display:
        flex;

    align-items:
        center;

    gap:
        13px;

    cursor:
        grab;

}


.order-number {

    width:
        28px;

    height:
        28px;

    border-radius:
        8px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        rgba(255,255,255,.07);

    color:
        var(--muted);

    font-size:
        12px;

    font-weight:
        900;

}


.order-buttons {

    display:
        flex;

    gap:
        7px;

    margin-left:
        auto;

}


.order-arrow {

    width:
        28px;

    height:
        28px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:
        8px;

    background:
        rgba(255,255,255,.04);

    color:
        white;

    cursor:
        pointer;

}


/* =========================================================
   EXPLICATION
========================================================= */

.explanation {

    display:
        none;

    margin-top:
        20px;

    padding:
        16px 18px;

    border-radius:
        13px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.07);

}


.explanation.show {

    display:
        block;

    animation:
        appear .25s ease;

}


.explanation-title {

    font-size:
        11px;

    font-weight:
        900;

    color:
        var(--red-light);

    text-transform:
        uppercase;

    letter-spacing:
        1px;

    margin-bottom:
        6px;

}


.explanation-text {

    color:
        #b0b5c0;

    font-size:
        13px;

    line-height:
        1.55;

}


/* =========================================================
   RESULTAT REPONSE
========================================================= */

.answer-result {

    display:
        none;

    margin-top:
        20px;

    padding:
        15px 17px;

    border-radius:
        13px;

    font-weight:
        800;

}


.answer-result.show {

    display:
        block;

}


.answer-result.correct {

    background:
        rgba(50,213,131,.10);

    color:
        var(--green);

}


.answer-result.wrong {

    background:
        rgba(255,82,99,.10);

    color:
        var(--wrong);

}


/* =========================================================
   BOUTON SUIVANT
========================================================= */

.next-wrapper {

    display:
        none;

    justify-content:
        flex-end;

    margin-top:
        18px;

}


.next-btn {

    border:
        0;

    padding:
        12px 20px;

    border-radius:
        11px;

    background:
        white;

    color:
        #090a0d;

    font-weight:
        850;

    cursor:
        pointer;

}


/* =========================================================
   FIN
========================================================= */

.result {

    text-align:
        center;

}


.result-icon {

    font-size:
        70px;

    margin-bottom:
        18px;

}


.result h2 {

    font-size:
        clamp(40px, 6vw, 60px);

    font-weight:
        950;

    letter-spacing:
        -2px;

}


.result p {

    color:
        var(--muted);

    margin:
        10px 0 30px;

}


.restart-btn {

    border:
        0;

    background:
        linear-gradient(
            135deg,
            #8f111a,
            #d92735
        );

    color:
        white;

    padding:
        15px 30px;

    border-radius:
        13px;

    font-weight:
        850;

    cursor:
        pointer;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .levels {

        grid-template-columns:
            1fr 1fr;

    }

    .answers {

        grid-template-columns:
            1fr;

    }

    .question-content {

        padding:
            27px 21px 25px;

    }

    .question-visual {

        min-height:
            145px;

    }

    .free-answer {

        flex-direction:
            column;

    }

    .validate-btn {

        min-height:
            52px;

    }

}

</style>

</head>

<div class="app">

     ACCUEIL

<section

>

<!-- =====================================================

<section

>

    </div>


</section>


<!-- =====================================================
     FIN

<section

>

    </div>


    <h2>
        Fin de l'aventure
    </h2>


    <p>
        Toutes les questions ont été parcourues.
    </p>


    <button
        class="restart-btn"
        onclick="startQuiz()"
    >
        Recommencer
    </button>


</section>

   =========================================================
   
                  MES QUESTIONS
                  
   =========================================================
   
   C'EST CETTE PARTIE QUE TU MODIFIERAS.
   
   Pour ajouter une question :
   → copie un bloc
   → modifie les informations
   → ajoute une virgule entre les blocs
   
   MODES DISPONIBLES :
   
   "unique"
   → une seule bonne réponse parmi plusieurs
   
   "multiple"
   → plusieurs bonnes réponses
   
   "libre"
   → réponse écrite au clavier
   
   "ordre"
   → remettre les éléments dans le bon ordre
   
   "vrai_faux"
   → Vrai ou Faux
   
   =========================================================
   =========================================================
*/

        ],

        bonneReponse:

    },

        question:

        reponses: [

            "Zoro",

/* =========================================================
   FIN DE LA ZONE QUESTIONS
========================================================= */


/* =========================================================
   VARIABLES DU QUIZ
========================================================= */

let currentQuestion = 0;

let answered = false;

let currentOrder = [];


/* =========================================================
   AFFICHER UN ECRAN
========================================================= */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });


    document
        .getElementById(id)
        .classList.add("active");

}


/* =========================================================
   DEMARRER
========================================================= */

function startQuiz() {

    currentQuestion = 0;

    showScreen("quiz");

    loadQuestion();

}


/* =========================================================
   CHARGER QUESTION
========================================================= */

function loadQuestion() {

    answered = false;

    const q =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        currentQuestion + 1;


    document
        .getElementById("totalQuestions")
        .textContent =
        questions.length;


    document
        .getElementById("currentLevel")
        .textContent =
        q.niveau;


    document
        .getElementById("difficulty")
        .textContent =
        q.difficulte;


    document
        .getElementById("category")
        .textContent =
        q.categorie;


    document
        .getElementById("question")
        .textContent =
        q.question;


    document
        .getElementById("progressBar")
        .style.width =
        (
            (currentQuestion + 1)
            /
            questions.length
            *
            100
        ) + "%";


    /* -----------------------------------------------------
       VISUEL
    ----------------------------------------------------- */

    const visual =
        document.getElementById(
            "questionVisual"
        );


    visual.innerHTML = "";


    if (q.image && q.image.trim() !== "") {

        const img =
            document.createElement("img");


        img.src =
            q.image;


        img.className =
            "visual-image";


        img.alt =
            "Illustration de la question";


        visual.appendChild(img);

    }

    else {

        const icon =
            document.createElement("div");


        icon.className =
            "visual-icon";


        icon.textContent =
            q.icone || "🏴‍☠️";


        visual.appendChild(icon);

    }


    /* -----------------------------------------------------
       RESET
    ----------------------------------------------------- */

    document
        .getElementById("answers")
        .innerHTML = "";


    document
        .getElementById("explanation")
        .classList.remove("show");


    document
        .getElementById("answerResult")
        .className =
        "answer-result";


    document
        .getElementById("answerResult")
        .textContent = "";


    document
        .getElementById("nextWrapper")
        .style.display =
        "none";


    /* -----------------------------------------------------
       MODE
    ----------------------------------------------------- */

    switch(q.mode) {

        case "unique":

            createUniqueQuestion(q);

            break;


        case "multiple":

            createMultipleQuestion(q);

            break;


        case "libre":

            createFreeQuestion(q);

            break;


        case "vrai_faux":

            createTrueFalseQuestion(q);

            break;


        case "ordre":

            createOrderQuestion(q);

            break;


        default:

            console.error(
                "Mode inconnu :",
                q.mode
            );

    }

}


/* =========================================================
   REPONSE UNIQUE
========================================================= */

function createUniqueQuestion(q) {

    const container =
        document.getElementById(
            "answers"
        );


    q.reponses.forEach(
        (answer, index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer";


            button.innerHTML = `

                <span class="answer-letter">
                    ${String.fromCharCode(65 + index)}
                </span>

                <span>
                    ${answer}
                </span>

            `;


            button.onclick =
                () =>
                    checkUnique(
                        index,
                        button
                    );


            container.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   VERIFIER UNIQUE
========================================================= */

function checkUnique(
    index,
    clickedButton
) {

    if (answered)
        return;


    answered = true;


    const q =
        questions[currentQuestion];


    const buttons =
        document.querySelectorAll(
            ".answer"
        );


    buttons.forEach(
        button =>
            button.disabled = true
    );


    buttons[q.bonneReponse]
        .classList
        .add("correct");


    if (index === q.bonneReponse) {

        clickedButton
            .classList
            .add("correct");


        showResult(
            true,
            "Bonne réponse ! ✓"
        );

    }

    else {

        clickedButton
            .classList
            .add("wrong");


        showResult(
            false,
            "Mauvaise réponse."
        );

    }

}


/* =========================================================
   REPONSE MULTIPLE
========================================================= */

function createMultipleQuestion(q) {

    const container =
        document.getElementById(
            "answers"
        );


    q.reponses.forEach(
        (answer, index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer";


            button.innerHTML = `

                <span class="answer-letter">
                    ${String.fromCharCode(65 + index)}
                </span>

                <span>
                    ${answer}
                </span>

            `;


            button.onclick =
                () => {

                    if (answered)
                        return;

                    button.classList.toggle(
                        "selected"
                    );

                };


            container.appendChild(
                button
            );

        }
    );


    const validate =
        document.createElement(
            "button"
        );


    validate.className =
        "validate-btn";


    validate.textContent =
        "Valider les réponses";


    validate.style.marginTop =
        "15px";


    validate.onclick =
        checkMultiple;


    container.appendChild(
        validate
    );

}


/* =========================================================
   VERIFIER MULTIPLE
========================================================= */

function checkMultiple() {

    if (answered)
        return;


    answered = true;


    const q =
        questions[currentQuestion];


    const buttons =
        document.querySelectorAll(
            ".answer"
        );


    const selected = [];


    buttons.forEach(
        (button, index) => {

            if (
                button.classList.contains(
                    "selected"
                )
            ) {

                selected.push(index);

            }

        }
    );


    const correct =
        [...selected]
        .sort()
        .join(",") ===

        [...q.bonnesReponses]
        .sort()
        .join(",");


    buttons.forEach(
        (button, index) => {

            button.disabled = true;


            if (
                q.bonnesReponses
                    .includes(index)
            ) {

                button.classList.add(
                    "correct"
                );

            }

            else if (
                button.classList.contains(
                    "selected"
                )
            ) {

                button.classList.add(
                    "wrong"
                );

            }

        }
    );


    showResult(
        correct,
        correct
            ? "Toutes les bonnes réponses ! ✓"
            : "La sélection n'est pas correcte."
    );

}


/* =========================================================
   REPONSE LIBRE
========================================================= */

function createFreeQuestion(q) {

    const container =
        document.getElementById(
            "answers"
        );


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "free-answer";


    const input =
        document.createElement(
            "input"
        );


    input.placeholder =
        "Écris ta réponse...";


    input.id =
        "freeInput";


    const button =
        document.createElement(
            "button"
        );


    button.className =
        "validate-btn";


    button.textContent =
        "Valider";


    button.onclick =
        checkFreeAnswer;


    input.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                checkFreeAnswer();

            }

        }
    );


    wrapper.appendChild(
        input
    );


    wrapper.appendChild(
        button
    );


    container.appendChild(
        wrapper
    );

}


/* =========================================================
   VERIFIER REPONSE LIBRE
========================================================= */

function checkFreeAnswer() {

    if (answered)
        return;


    answered = true;


    const q =
        questions[currentQuestion];


    const input =
        document.getElementById(
            "freeInput"
        );


    const userAnswer =
        normalize(
            input.value
        );


    const correctAnswer =
        normalize(
            q.bonneReponse
        );


    const correct =
        userAnswer ===
        correctAnswer;


    input.disabled = true;


    showResult(
        correct,
        correct
            ? "Bonne réponse ! ✓"
            : "Mauvaise réponse. Réponse attendue : "
              + q.bonneReponse
    );

}


/* =========================================================
   VRAI / FAUX
========================================================= */

function createTrueFalseQuestion(q) {

    const container =
        document.getElementById(
            "answers"
        );


    ["Vrai", "Faux"].forEach(
        (answer, index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer";


            button.innerHTML = `

                <span class="answer-letter">
                    ${index === 0 ? "V" : "F"}
                </span>

                <span>
                    ${answer}
                </span>

            `;


            button.onclick =
                () =>
                    checkTrueFalse(
                        index === 0,
                        button
                    );


            container.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   VERIFIER VRAI / FAUX
========================================================= */

function checkTrueFalse(
    value,
    clickedButton
) {

    if (answered)
        return;


    answered = true;


    const q =
        questions[currentQuestion];


    const buttons =
        document.querySelectorAll(
            ".answer"
        );


    buttons.forEach(
        button =>
            button.disabled = true
    );


    const correctIndex =
        q.bonneReponse
            ? 0
            : 1;


    buttons[correctIndex]
        .classList
        .add("correct");


    if (
        value ===
        q.bonneReponse
    ) {

        clickedButton
            .classList
            .add("correct");


        showResult(
            true,
            "Bonne réponse ! ✓"
        );

    }

    else {

        clickedButton
            .classList
            .add("wrong");


        showResult(
            false,
            "Mauvaise réponse."
        );

    }

}


/* =========================================================
   REMETTRE DANS L'ORDRE
========================================================= */

function createOrderQuestion(q) {

    const container =
        document.getElementById(
            "answers"
        );


    currentOrder =
        [...q.reponses];


    const list =
        document.createElement(
            "div"
        );


    list.className =
        "order-list";


    renderOrderList(
        list
    );


    container.appendChild(
        list
    );


    const validate =
        document.createElement(
            "button"
        );


    validate.className =
        "validate-btn";


    validate.textContent =
        "Valider l'ordre";


    validate.style.marginTop =
        "15px";


    validate.onclick =
        () =>
            checkOrder(list);


    container.appendChild(
        validate
    );

}


/* =========================================================
   AFFICHER ORDRE
========================================================= */

function renderOrderList(list) {

    list.innerHTML = "";


    currentOrder.forEach(
        (item, index) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "order-item";


            row.innerHTML = `

                <span class="order-number">
                    ${index + 1}
                </span>

                <span>
                    ${item}
                </span>

                <div class="order-buttons">

                    <button
                        class="order-arrow"
                        onclick="moveOrder(${index}, -1)"
                    >
                        ↑
                    </button>

                    <button
                        class="order-arrow"
                        onclick="moveOrder(${index}, 1)"
                    >
                        ↓
                    </button>

                </div>

            `;


            list.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   BOUGER ELEMENT
========================================================= */

function moveOrder(
    index,
    direction
) {

    if (answered)
        return;


    const newIndex =
        index + direction;


    if (
        newIndex < 0 ||
        newIndex >= currentOrder.length
    ) {

        return;

    }


    [
        currentOrder[index],
        currentOrder[newIndex]

    ] = [

        currentOrder[newIndex],
        currentOrder[index]

    ];


    const list =
        document.querySelector(
            ".order-list"
        );


    renderOrderList(
        list
    );

}


/* =========================================================
   VERIFIER ORDRE
========================================================= */

function checkOrder(list) {

    if (answered)
        return;


    answered = true;


    const q =
        questions[currentQuestion];


    const correct =
        JSON.stringify(
            currentOrder
        ) ===

        JSON.stringify(
            q.ordreCorrect
        );


    document
        .querySelectorAll(
            ".order-arrow"
        )
        .forEach(
            button =>
                button.disabled = true
        );


    showResult(
        correct,
        correct
            ? "Ordre correct ! ✓"
            : "L'ordre n'est pas correct."
    );

}


/* =========================================================
   RESULTAT IMMEDIAT
========================================================= */

function showResult(
    correct,
    message
) {

    const result =
        document.getElementById(
            "answerResult"
        );


    result.textContent =
        message;


    result.className =
        "answer-result show " +
        (
            correct
                ? "correct"
                : "wrong"
        );


    const q =
        questions[currentQuestion];


    if (q.explanation) {

        document
            .getElementById(
                "explanationText"
            )
            .textContent =
            q.explanation;


        document
            .getElementById(
                "explanation"
            )
            .classList
            .add("show");

    }


    document
        .getElementById(
            "nextWrapper"
        )
        .style.display =
        "flex";

}


/* =========================================================
   NORMALISER TEXTE
========================================================= */

function normalize(text) {

    return text

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /[^a-z0-9]/g,
            ""
        )

        .trim();

}


/* =========================================================
   QUESTION SUIVANTE
========================================================= */

function nextQuestion() {

    currentQuestion++;


    if (
        currentQuestion >=
        questions.length
    ) {

        showScreen(
            "result"
        );

    }

    else {

        loadQuestion();

    }

}


/* =========================================================
   PASSER UNE QUESTION
========================================================= */

function skipQuestion() {

    currentQuestion++;


    if (
        currentQuestion >=
        questions.length
    ) {

        showScreen(
            "result"
        );

    }

    else {

        loadQuestion();

    }

}
