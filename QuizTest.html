<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Piece Quiz</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --bg: #080b14;
        --card: rgba(255,255,255,0.07);
        --card-hover: rgba(255,255,255,0.12);
        --text: #ffffff;
        --muted: #aeb5c7;
        --accent: #7c5cff;
        --accent-2: #4cc9f0;
        --green: #35d07f;
        --red: #ff5263;
    }

    body {
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
            radial-gradient(circle at 20% 10%, rgba(124,92,255,0.22), transparent 30%),
            radial-gradient(circle at 80% 90%, rgba(76,201,240,0.16), transparent 30%),
            var(--bg);
        color: var(--text);
        overflow-x: hidden;
    }

    button {
        font: inherit;
    }

    .app {
        width: min(1100px, 94%);
        min-height: 100vh;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 0;
    }

    .screen {
        width: 100%;
        display: none;
        animation: fadeIn .45s ease;
    }

    .screen.active {
        display: block;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(15px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* =========================
       ACCUEIL
    ========================= */

    .home {
        text-align: center;
    }

    .logo {
        width: 90px;
        height: 90px;
        margin: 0 auto 28px;
        border-radius: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 46px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 20px 60px rgba(124,92,255,.35);
        transform: rotate(-5deg);
    }

    .home h1 {
        font-size: clamp(42px, 7vw, 76px);
        font-weight: 900;
        letter-spacing: -3px;
        margin-bottom: 12px;
    }

    .home h1 span {
        background: linear-gradient(90deg, #ffffff, #a98cff, #5edcff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .home p {
        color: var(--muted);
        font-size: 18px;
        margin-bottom: 38px;
    }

    .start-btn {
        border: 0;
        color: white;
        background: linear-gradient(135deg, var(--accent), #5d8dff);
        padding: 18px 48px;
        border-radius: 18px;
        font-size: 18px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 15px 40px rgba(124,92,255,.3);
        transition: .2s;
    }

    .start-btn:hover {
        transform: translateY(-4px) scale(1.02);
        box-shadow: 0 20px 50px rgba(124,92,255,.45);
    }

    .info {
        margin-top: 35px;
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .pill {
        padding: 9px 15px;
        border-radius: 100px;
        background: rgba(255,255,255,.06);
        border: 1px solid rgba(255,255,255,.08);
        color: var(--muted);
        font-size: 13px;
    }

    /* =========================
       QUIZ
    ========================= */

    .quiz-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 25px;
        gap: 20px;
    }

    .progress-wrapper {
        flex: 1;
    }

    .progress-text {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 9px;
    }

    .progress {
        width: 100%;
        height: 7px;
        background: rgba(255,255,255,.08);
        border-radius: 20px;
        overflow: hidden;
    }

    .progress-bar {
        height: 100%;
        width: 50%;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        border-radius: inherit;
        transition: width .4s ease;
    }

    .score {
        padding: 11px 18px;
        border-radius: 14px;
        background: rgba(255,255,255,.07);
        font-weight: 800;
        white-space: nowrap;
    }

    .question-card {
        background: rgba(255,255,255,.055);
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 28px;
        padding: clamp(25px, 5vw, 50px);
        backdrop-filter: blur(20px);
        box-shadow: 0 25px 80px rgba(0,0,0,.25);
    }

    .category {
        color: #a98cff;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 800;
        margin-bottom: 18px;
    }

    .question {
        font-size: clamp(27px, 4vw, 42px);
        line-height: 1.15;
        font-weight: 850;
        letter-spacing: -1px;
        margin-bottom: 35px;
    }

    .answers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
    }

    .answer {
        min-height: 80px;
        padding: 18px 22px;
        border: 1px solid rgba(255,255,255,.09);
        border-radius: 17px;
        background: var(--card);
        color: white;
        text-align: left;
        cursor: pointer;
        transition: .18s;
        display: flex;
        align-items: center;
        gap: 15px;
        font-weight: 700;
        font-size: 16px;
    }

    .answer:hover:not(:disabled) {
        transform: translateY(-3px);
        background: var(--card-hover);
        border-color: rgba(255,255,255,.2);
    }

    .answer-letter {
        width: 38px;
        height: 38px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 11px;
        background: rgba(255,255,255,.08);
        color: #c9cde0;
        font-weight: 900;
    }

    .answer.correct {
        background: rgba(53,208,127,.16);
        border-color: var(--green);
    }

    .answer.correct .answer-letter {
        background: var(--green);
        color: #06130d;
    }

    .answer.wrong {
        background: rgba(255,82,99,.14);
        border-color: var(--red);
    }

    .answer.wrong .answer-letter {
        background: var(--red);
        color: white;
    }

    .answer:disabled {
        cursor: default;
    }

    .timer-wrapper {
        margin-top: 28px;
    }

    .timer-text {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 7px;
    }

    .timer {
        height: 5px;
        border-radius: 20px;
        background: rgba(255,255,255,.08);
        overflow: hidden;
    }

    .timer-bar {
        width: 100%;
        height: 100%;
        background: var(--accent-2);
        transition: width 1s linear;
    }

    /* =========================
       FEEDBACK
    ========================= */

    .feedback {
        display: none;
        margin-top: 22px;
        padding: 18px;
        border-radius: 15px;
        background: rgba(255,255,255,.05);
    }

    .feedback.show {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
    }

    .feedback-title {
        font-weight: 900;
    }

    .feedback-subtitle {
        color: var(--muted);
        font-size: 14px;
        margin-top: 4px;
    }

    .next-btn {
        border: 0;
        padding: 12px 20px;
        border-radius: 12px;
        background: white;
        color: #10121b;
        font-weight: 850;
        cursor: pointer;
    }

    /* =========================
       RESULTATS
    ========================= */

    .result {
        text-align: center;
    }

    .result-icon {
        font-size: 75px;
        margin-bottom: 20px;
    }

    .result h2 {
        font-size: clamp(38px, 6vw, 62px);
        font-weight: 900;
        letter-spacing: -2px;
    }

    .result p {
        color: var(--muted);
        font-size: 18px;
        margin-top: 10px;
    }

    .result-score {
        margin: 35px auto;
        width: 190px;
        height: 190px;
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(circle, #111522 57%, transparent 58%),
            conic-gradient(var(--accent) var(--score-percent), rgba(255,255,255,.08) 0);
        box-shadow: 0 0 70px rgba(124,92,255,.18);
    }

    .result-score strong {
        font-size: 48px;
        font-weight: 900;
    }

    .result-score span {
        color: var(--muted);
        font-size: 13px;
    }

    .restart-btn {
        border: 0;
        background: linear-gradient(135deg, var(--accent), #5d8dff);
        color: white;
        padding: 16px 35px;
        border-radius: 15px;
        font-weight: 850;
        cursor: pointer;
        transition: .2s;
    }

    .restart-btn:hover {
        transform: translateY(-3px);
    }

    @media (max-width: 700px) {
        .answers {
            grid-template-columns: 1fr;
        }

        .quiz-header {
            align-items: flex-end;
        }

        .question-card {
            border-radius: 20px;
        }

        .feedback.show {
            flex-direction: column;
            align-items: stretch;
        }

        .next-btn {
            width: 100%;
        }
    }
</style>
</head>

<body>

<div class="app">

    <!-- ================= ACCUEIL ================= -->

    <section id="home" class="screen active home">

        <div class="logo">☠️</div>

        <h1><span>ONE PIECE</span><br>QUIZ</h1>

        <p>Teste tes connaissances sur le monde de Grand Line.</p>

        <button class="start-btn" onclick="startQuiz()">
            Commencer le quiz
        </button>

        <div class="info">
            <div class="pill">2 questions</div>
            <div class="pill">Mode classique</div>
            <div class="pill">Chrono activé</div>
        </div>

    </section>


    <!-- ================= QUIZ ================= -->

    <section id="quiz" class="screen">

        <div class="quiz-header">

            <div class="progress-wrapper">

                <div class="progress-text">
                    Question <span id="questionNumber">1</span> / <span id="totalQuestions">2</span>
                </div>

                <div class="progress">
                    <div id="progressBar" class="progress-bar"></div>
                </div>

            </div>

            <div class="score">
                ⭐ <span id="score">0</span>
            </div>

        </div>


        <div class="question-card">

            <div id="category" class="category">
                One Piece
            </div>

            <div id="question" class="question">
                Question...
            </div>

            <div id="answers" class="answers"></div>


            <div class="timer-wrapper">

                <div class="timer-text">
                    <span>Temps restant</span>
                    <span id="timerText">15s</span>
                </div>

                <div class="timer">
                    <div id="timerBar" class="timer-bar"></div>
                </div>

            </div>


            <div id="feedback" class="feedback">

                <div>
                    <div id="feedbackTitle" class="feedback-title"></div>
                    <div id="feedbackSubtitle" class="feedback-subtitle"></div>
                </div>

                <button class="next-btn" onclick="nextQuestion()">
                    Continuer →
                </button>

            </div>

        </div>

    </section>


    <!-- ================= RESULTAT ================= -->

    <section id="result" class="screen result">

        <div class="result-icon">🏆</div>

        <h2>Quiz terminé !</h2>

        <p id="resultMessage">
            Pas mal !
        </p>

        <div id="resultCircle" class="result-score">

            <strong id="finalScore">0</strong>
            <span>points</span>

        </div>

        <button class="restart-btn" onclick="startQuiz()">
            Rejouer
        </button>

    </section>

</div>


<script>

const questions = [

    {
        category: "Équipage de Luffy",
        question: "Quel est le premier membre à rejoindre l'équipage de Luffy ?",
        answers: [
            "Nami",
            "Roronoa Zoro",
            "Usopp",
            "Sanji"
        ],
        correct: 1
    },

    {
        category: "Grand Line",
        question: "Comment s'appelle le navire emblématique de l'équipage de Luffy après le Vogue Merry ?",
        answers: [
            "Red Force",
            "Thousand Sunny",
            "Oro Jackson",
            "Polar Tang"
        ],
        correct: 1
    }

];


let currentQuestion = 0;
let score = 0;
let timer;
let timeLeft = 15;
let answered = false;


/* =========================
   OUTILS
========================= */

function showScreen(id) {

    document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}


/* =========================
   DEMARRER
========================= */

function startQuiz() {

    currentQuestion = 0;
    score = 0;

    document.getElementById("score").textContent = "0";

    showScreen("quiz");

    loadQuestion();
}


/* =========================
   CHARGER QUESTION
========================= */

function loadQuestion() {

    clearInterval(timer);

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        currentQuestion + 1;

    document.getElementById("totalQuestions").textContent =
        questions.length;

    document.getElementById("category").textContent =
        q.category;

    document.getElementById("question").textContent =
        q.question;

    document.getElementById("progressBar").style.width =
        ((currentQuestion + 1) / questions.length) * 100 + "%";


    const answersContainer =
        document.getElementById("answers");

    answersContainer.innerHTML = "";


    q.answers.forEach((answer, index) => {

        const button = document.createElement("button");

        button.className = "answer";

        button.innerHTML = `
            <span class="answer-letter">
                ${String.fromCharCode(65 + index)}
            </span>

            <span>${answer}</span>
        `;

        button.onclick = () => selectAnswer(index, button);

        answersContainer.appendChild(button);

    });


    startTimer();

    document.getElementById("feedback").classList.remove("show");

}


/* =========================
   CHRONO
========================= */

function startTimer() {

    timeLeft = 15;

    updateTimer();

    timer = setInterval(() => {

        timeLeft--;

        updateTimer();

        if (timeLeft <= 0) {

            clearInterval(timer);

            selectAnswer(-1, null);

        }

    }, 1000);

}


function updateTimer() {

    document.getElementById("timerText").textContent =
        timeLeft + "s";

    document.getElementById("timerBar").style.width =
        (timeLeft / 15) * 100 + "%";

}


/* =========================
   REPONSE
========================= */

function selectAnswer(index, clickedButton) {

    if (answered) return;

    answered = true;

    clearInterval(timer);


    const q = questions[currentQuestion];

    const buttons =
        document.querySelectorAll(".answer");


    buttons.forEach(button => {
        button.disabled = true;
    });


    const correctButton = buttons[q.correct];

    correctButton.classList.add("correct");


    if (index === q.correct) {

        clickedButton.classList.add("correct");

        /*
         * Plus tu réponds vite,
         * plus tu gagnes de points.
         */
        const points = 500 + (timeLeft * 30);

        score += points;

        document.getElementById("score").textContent =
            score;

        showFeedback(
            "Bonne réponse ! 🎯",
            "+" + points + " points"
        );

    } else {

        if (clickedButton) {
            clickedButton.classList.add("wrong");
        }

        showFeedback(
            "Raté !",
            "La bonne réponse était : " +
            q.answers[q.correct]
        );

    }

}


/* =========================
   FEEDBACK
========================= */

function showFeedback(title, subtitle) {

    document.getElementById("feedbackTitle").textContent =
        title;

    document.getElementById("feedbackSubtitle").textContent =
        subtitle;

    document.getElementById("feedback").classList.add("show");

}


/* =========================
   QUESTION SUIVANTE
========================= */

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        finishQuiz();

    } else {

        loadQuestion();

    }

}


/* =========================
   FIN
========================= */

function finishQuiz() {

    clearInterval(timer);

    showScreen("result");


    document.getElementById("finalScore").textContent =
        score;


    const maxScore =
        questions.length * 950;

    const percent =
        Math.round((score / maxScore) * 100);


    document.getElementById("resultCircle")
        .style.setProperty(
            "--score-percent",
            percent + "%"
        );


    let message;

    if (percent >= 80) {

        message = "Tu connais vraiment bien One Piece. 👑";

    } else if (percent >= 50) {

        message = "Pas mal du tout, mais tu peux encore progresser !";

    } else {

        message = "Il va falloir retourner sur Grand Line. ☠️";

    }


    document.getElementById("resultMessage")
        .textContent = message;

}

</script>

</body>
</html>
